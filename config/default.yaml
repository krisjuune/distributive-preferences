# Registry of raw survey exports and how to read them.
# Add a new entry here whenever a new wave/country file is dropped into raw-data/.
waves:
  wave1_ch:
    file: wave1_CH_120624.csv
    wave: 1
    country: CH
    topic: heating-pv-choice
    platform: qualtrics       # 2 metadata rows (question text, ImportId JSON) below the header
  wave2_ch:
    file: wave2_CH_111224_1531.csv
    wave: 2
    country: CH
    topic: flying-wtc-wtp
    platform: qualtrics
  wave2_cn:
    file: wave2_CN_111224_1532.csv
    wave: 2
    country: CN
    topic: flying-wtc-wtp
    platform: qualtrics
  wave2_us:
    file: wave2_US_111224_1531.csv
    wave: 2
    country: US
    topic: flying-wtc-wtp
    platform: qualtrics
  wave3_ch:
