    wave: 3
    country: CH
    topic: ccs-conjoint
    platform: qualtrics
  wave3_cn:
    file: wave3_CN_240225_1752.csv
    wave: 3
    country: CN
    topic: ccs-conjoint
    platform: qualtrics
  # Wave 4 is one SoSci export covering 9 countries, distinguished only by
  # the LANGUAGE field (no explicit country variable in the export). Also
  # bundles 4 parallel QUESTNNR panel-routing links (qnr6 + Survey_NFDI01-03)
  # for the same live fielding window -- pooled here, not split, since they
  # share the same dates and the same proportional split across languages.
  # A small 'eng' group (102 of 21293 rows, ~0.5%) isn't attributable to any
  # single country and is dropped by omission (not listed below).
  wave4_it:
    file: wave4_EU_060726_1246.csv
    wave: 4
    country: IT
    topic: policy-instruments
    platform: sosci
    country_column: LANGUAGE
    country_value: ita
  wave4_fr:
