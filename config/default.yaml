# Columns that carry PII/identifying info when present (only the Qualtrics wave 3
# exports have them). Dropped unconditionally at preprocessing time, if present.
pii_columns:
  - RecipientFirstName
  - RecipientLastName
  - RecipientEmail
  - ExternalReference
  - IPAddress
  - LocationLatitude
  - LocationLongitude

# Non-substantive Qualtrics/SoSci bookkeeping columns dropped at preprocessing time.
metadata_columns:
  - StartDate
  - EndDate
  - Status
  - IPAddress
  - Progress
  - Duration (in seconds)
  - Finished
  - RecordedDate
  - ResponseId
  - DistributionChannel
  - UserLanguage
  - SelectedLanguage
  - SERIAL
  - REF
  - QUESTNNR
  - MODE
  - STARTED
  - MAILSENT
  - LASTDATA
  - STATUS
  - FINISHED
  - Q_VIEWER
  - LASTPAGE
  - MAXPAGE
  - MISSING
  - MISSREL
  - TIME_RSI

# TODO: fill in per-topic construct definitions (indicator columns for LPA,
# predictor/outcome formulas for regression) once the codebook for each wave
# is finalised. See src/analyse/lpa.R and src/analyse/regression.R.
lpa:
  n_profiles_max: 8
  random_seed: 42
  # Bootstrapped likelihood-ratio test (Nylund-Gibson et al.) for the profile
  # count, run at the two decision boundaries the main text reports (2 vs 3,
  # 3 vs 4) via mclust's mclustBootstrapLRT() -- a formal test companion to
  # the information-criteria elbow plot, not a resampling of the elbow plot
  # itself. maxG=4 gets us the 1-vs-2, 2-vs-3, and 3-vs-4 comparisons in one
  # sequential run; only the latter two are reported in the main text.
  blrt:
    nboot: 999
    max_g: 4
  # Fixed profile count used only for the cross-wave spaghetti comparison
  # (src/vis/plot_lpa_spaghetti.R) -- independent of each wave's own
  # BIC-optimal G used everywhere else, so every wave/country sample can be
  # viewed side by side at the same G.
  spaghetti_g: 3
  spaghetti_sample_n: 50
  # Number of wave/country blocks per row in the main spaghetti grid.
  spaghetti_ncol: 3
  # Row titles for the main spaghetti grid -- waves 1, 3, and 4 use Likert
  # scales; wave 2 uses constant-sum (points-allocation) items.
  spaghetti_titles:
    wave1_ch: "Wave 1 Switzerland (Likert scale)"
    wave2_ch: "Wave 2 Switzerland (constant sum)"
    wave2_cn: "Wave 2 China (constant sum)"
    wave2_us: "Wave 2 United States (constant sum)"
    wave3_ch: "Wave 3 Switzerland (Likert scale)"
    wave3_cn: "Wave 3 China (Likert scale)"
    wave4_it: "Wave 4 Italy (Likert scale)"
    wave4_fr: "Wave 4 France (Likert scale)"
    wave4_es: "Wave 4 Spain (Likert scale)"
    wave4_fi: "Wave 4 Finland (Likert scale)"
    wave4_pl: "Wave 4 Poland (Likert scale)"
    wave4_nl: "Wave 4 Netherlands (Likert scale)"
    wave4_de: "Wave 4 Germany (Likert scale)"
    wave4_dk: "Wave 4 Denmark (Likert scale)"
    wave4_ee: "Wave 4 Estonia (Likert scale)"
  # One representative wave/country sample per country, for the publication
  # composition chart -- excludes wave2_ch/wave3_ch/wave2_cn since
  # Switzerland and China already have a representative sample from
  # another wave (wave1_ch, wave3_cn).
  composition_waves:
    wave1_ch: Switzerland
    wave2_us: United States
    wave3_cn: China
    wave4_it: Italy
    wave4_fr: France
    wave4_es: Spain
    wave4_fi: Finland
    wave4_pl: Poland
    wave4_nl: Netherlands
    wave4_de: Germany
    wave4_dk: Denmark
    wave4_ee: Estonia
  # Wave(s) per topic, for the supplementary shape figure -- all countries
  # within a wave pooled together to represent that topic as a whole.
  shape_topics:
    "Swiss decarbonisation": [wave1_ch]
    "Sustainable aviation": [wave2_ch, wave2_cn, wave2_us]
    "Carbon storage": [wave3_ch, wave3_cn]
    "Policy instruments":
      [wave4_it, wave4_fr, wave4_es, wave4_fi, wave4_pl, wave4_nl, wave4_de, wave4_dk, wave4_ee]

# Confirmatory factor analysis of the justice-principle items (not the LPA
# indicator scores). wave2 is included only for comparison against
# wave1_3's Likert items -- its constant-sum items are ipsative and violate
# the local-independence assumption standard CFA relies on, so its fit
# indices shouldn't be read as evidence about the theoretical structure,
# only about how badly the measurement format itself breaks CFA's
# assumptions.
cfa:
  groups:
    wave1_3: [wave1_ch, wave3_ch, wave3_cn]
    wave2: [wave2_ch, wave2_cn, wave2_us]
    wave4: [wave4_it, wave4_fr, wave4_es, wave4_fi, wave4_pl, wave4_nl, wave4_de, wave4_dk, wave4_ee]

regression:
  random_seed: 42
  # Pooled multi-country regressions -- gives small-sample countries more
  # stable estimates than a per-country fit can support (wave 4 countries
  # run as low as ~100-250 respondents, ~10-40 Utilitarian). `country` is
  # added automatically as a control predictor whenever a group is fit
  # (see regression.R). Every wave_id in a group must share one topic.
  groups:
    wave4_eu: [wave4_it, wave4_fr, wave4_es, wave4_fi, wave4_pl, wave4_nl, wave4_de, wave4_dk, wave4_ee]
  # nnet::multinom's built-in ridge-type penalty -- tempers residual
  # quasi-complete separation (huge/infinite odds ratios) in small
  # samples with a rare outcome category, e.g. wave 4's per-country
  # models. Verified against the worst observed case (wave4_fi): 0.1
  # brings the max odds ratio from 216 down to ~30 without visibly
  # changing the already well-behaved wave 1-3 estimates.
  decay: 0.1
  # Nonparametric bootstrap settings for the predicted-probability
  # confidence bands (see regression_probability_helpers.R) -- resample
  # respondents with replacement, refit, predict on the same grid, and
  # take the ci_level empirical percentile of the resulting curves.
  bootstrap:
    reps: 200 # reasonable speed/precision tradeoff for models this size (each refit takes well under a second)
    ci_level: 0.95
  # Composite predicted-probability grid: rows are samples, columns are the
  # three dimensions of ideology shared by every sample (economic,
  # cultural, ecological) -- fully populated, no empty cells.
  probability_grid:
    rows:
      - label: Europe
        wave_id: wave4_eu
      - label: Switzerland
        wave_id: wave3_ch
      - label: China
        wave_id: wave3_cn
    columns:
      - label: Economic values
        predictor: socio_econ_index
      - label: Cultural values
        predictor: socio_cult_index
      - label: Ecological concern
        predictor: socio_ecol_index
  # Second composite grid: cultural worldviews (Kahan's individualism-
  # communitarianism/hierarchy-egalitarianism) and energy security concern
  # -- wave4-only constructs with no wave3 equivalent, so a single row
  # rather than empty cells elsewhere.
  probability_grid_worldviews:
    rows:
      - label: Europe
        wave_id: wave4_eu
    columns:
      - label: Individualism-communitarianism
        predictor: cultural_worldview_ic_index
      - label: Hierarchy-egalitarianism
        predictor: cultural_worldview_he_index
      - label: Energy security concern
        predictor: energy_security_index
  # 2D predicted-probability surface (P(focal_profile) over a grid of two
  # predictors, faceted by country) -- tests whether the two predictors'
  # effects on profile membership are additive or interactive.
  probability_surface:
    wave_ids: [wave4_eu, wave3_ch, wave3_cn]
    x_predictor: socio_ecol_index
    y_predictor: socio_econ_index
    focal_profile: Utilitarian
    country_labels:
      wave4_eu: Europe
      wave3_ch: Switzerland
      wave3_cn: China

# Wave 3's open-ended "why did you answer this way" justice-reasoning
# questions -- only wave3_ch/wave3_cn have them. Respondents were randomly
# shown exactly one of the three context questions (general/tax/subsidy),
# never more than one.
open_ended:
  waves: [wave3_ch, wave3_cn]
  # Stratified (country x context x profile_class) validation sample for
  # the human/LLM classification agreement check. Utilitarian is
  # deliberately oversampled relative to its true population share -- it
  # both responds to the open-ended questions less often (see the
  # selection-bias check) and is the profile the CFA/bifactor work found
  # weakest, so it's the cell validation needs the most power in.
  validation:
    random_seed: 42
    n_per_cell:
      Egalitarian: 8
      Universalist: 8
      Utilitarian: 14
    # Pinned snapshot (not a "latest" alias) so re-running the translation
    # step later reproduces the same output rather than silently picking
    # up a newer model. Translation quality matters less than for the
    # actual classification, so this deliberately uses the cheap/fast
    # tier rather than the "not cheapest" model chosen for classification.
    translation_model: "claude-haiku-4-5-20251001"
  # LLM classification is not wired into `rule all` by default -- it costs
  # money and isn't bit-reproducible the way the rest of the pipeline is.
  # Flip enabled to true (once the validation step above has been run and
  # a model tier chosen) to include it in a default pipeline run.
  llm_classification:
    enabled: false
